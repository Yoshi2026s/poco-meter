name: ボーダー自動更新

# 取得元（one-carat.com）を2系統で確認し、data/borders.json に保存する。
#  1. 記事本文の「前日ランクボーダー」（主）
#  2. 月別の表画像（3日以上前の欠けた日だけを補う。既知の日と全一致した画像だけを使う）
# 毎日 05:00 と 17:00（日本時間）。GitHub の定期実行は混雑で数分〜数十分遅れることがある。
on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 JST
    - cron: '0 8 * * *'    # 17:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: border-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: テスト（ネットワークなし）
        run: node --test tests/pages-borders.mjs tests/table-channel.mjs
      - name: 取得元を確認して data/borders.json を更新
        id: update
        run: |
          set +e
          node automation/update-borders-json.mjs --file=data/borders.json | tee update-report.json
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      # メーター予想の情報源。公式noteのRSSから新しい記事だけを取り、事実（名前・期間・対象ランク・URL）を
      # data/events.json に追記する。失敗してもボーダーの保存は止めない。
      - name: イベント情報を収集（Pococha公式note・新着のみ）
        id: events
        continue-on-error: true
        run: node automation/collect-events.mjs --file=data/events.json | tee events-report.json
      - name: メーター予想の補正値を集計
        continue-on-error: true
        run: node automation/build-meter-factors.mjs
      - name: 予想の答え合わせ（記録のある全期間・月ごとに過去のデータだけで補正）
        continue-on-error: true
        run: node automation/backtest-forecast.mjs
      - name: 日々の予想を記録し、実際のボーダーで答え合わせ
        continue-on-error: true
        run: node automation/record-forecast.mjs | tee forecast-log-report.json
      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/borders.json data/border-provenance.json 2>/dev/null || git add data/borders.json
          git add data/events.json data/meter-factors.json data/forecast-backtest.json data/forecast-log.json 2>/dev/null || true
          git commit -m "ボーダー自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "pushに失敗しました"; exit 1
      - name: 結果をジョブ概要に記録
        if: always()
        run: |
          if [ -f update-report.json ]; then
            { echo '### ボーダー自動更新の結果'; echo '```json'; cat update-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f events-report.json ]; then
            { echo '### イベント収集の結果'; echo '```json'; cat events-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f forecast-log-report.json ]; then
            { echo '### 予想の記録と答え合わせ'; echo '```json'; cat forecast-log-report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 取得が止まった場合は失敗として通知
        if: steps.update.outputs.exit != '0'
        run: |
          echo "取得元の確認が止まりました（403は再試行しません）。保存済みの値は保持しています。"
          exit 1

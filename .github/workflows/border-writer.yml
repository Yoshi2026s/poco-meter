name: ボーダー自動取得（手動起動のみ）

# 定期実行（schedule）はまだ設定しない。運用開始は所有者の承認後に別途追加する。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan=通信なし / diagnose=GETのみ / discover=署名付きURL判定（保存なし） / refresh=本番保存'
        type: choice
        options: [plan, diagnose, discover, refresh]
        default: plan
      confirm:
        description: 'refreshのときだけ「production-write」と入力'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: border-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 自動取得クライアントのテスト（ネットワークなし）
        run: node --test tests/automation-border-client.mjs
      - name: 実行
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          # 署名が必要なモードでだけキーを渡す。値はログに出さない。
          BORDER_WRITER_KEY: ${{ (inputs.mode == 'discover' || inputs.mode == 'refresh') && secrets.BORDER_WRITER_KEY || '' }}
        run: |
          set -eu
          args="--mode=$MODE --report=border-report.json"
          if [ "$MODE" = "refresh" ]; then
            if [ "$CONFIRM" != "production-write" ]; then
              echo "refreshには confirm=production-write が必要です。"; exit 64
            fi
            args="$args --confirm-production-write"
          fi
          node automation/run-border-writer.mjs $args
      - name: 結果をジョブ概要に記録
        if: always()
        run: |
          if [ -f border-report.json ]; then
            {
              echo '### ボーダー自動取得の結果'
              echo '```json'
              cat border-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

name: メーター計算・ボーダー保存の検証
on:
  # 資料だけの変更では実行しない（時間短縮）
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # 計算テストは画面のスクリプトを構文解析する。アプリの依存一式（next）は入れず、
      # 解析器 acorn だけを版指定で一時フォルダーへ入れる。
      - name: テスト用の構文解析器を準備
        run: |
          npm install --prefix "$RUNNER_TEMP/test-tools" --no-save --no-audit --no-fund --ignore-scripts acorn@8.15.0
          echo "NODE_PATH=$RUNNER_TEMP/test-tools/node_modules" >> "$GITHUB_ENV"
      - name: 計算・コア数入力・保存認証・履歴検索を検証
        run: |
          node tests/calculation-engine.mjs
          node tests/periods-default-rank.mjs
          node tests/items-core-input.mjs
          node tests/current-input-confirm.mjs
          node tests/next-move-line.mjs
          node tests/current-restore.mjs
          node tests/hit-calendar-pick.mjs
          node tests/touch-select-native.mjs
          node tests/ocr-self-host.mjs
          node tests/public-safety.mjs
          node tests/e-border-csp-publish.mjs
          node tests/subpage-ogp.mjs
          node tests/pages-goatcounter-notice.mjs
          node tests/event-link-url.mjs
          node tests/collect-events-hosts.mjs
          node tests/border-user-agent.mjs
          node tests/e-border-disclaimer.mjs
          node tests/border-write-auth.mjs
          node tests/history-search.mjs
          node tests/event-calendar.mjs
          node tests/meter-sources.mjs
          node tests/always-on-forecast.mjs
          node tests/forecast-log.mjs
      # 依存パッケージ不要。上の手順の結果にかかわらず実行する。
      - name: GitHub Pages版とボーダー更新（ネットワークなし）を検証
        if: always()
        run: node --test tests/pages-borders.mjs tests/table-channel.mjs tests/pages-visitor-stats.mjs

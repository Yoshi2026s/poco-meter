name: GitHub Pages 公開

# 計算画面とボーダーを https://yoshi2026s.github.io/poco-meter/ に公開する。
# ボーダー自動更新のコミットは GITHUB_TOKEN で行われ push イベントを起こさないため、
# workflow_run でも公開する。
on:
  push:
    branches: ['(root)']
  workflow_run:
    workflows: ['ボーダー自動更新']
    types: [completed]
  workflow_dispatch:

# 既定は読み取りだけ。公開に必要な権限は deploy ジョブにだけ付ける。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: テスト（ネットワークなし）
        run: node --test tests/pages-borders.mjs
      - name: 公開ファイルを作成
        run: node scripts/build-pages.mjs --out=_site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # actions/upload-pages-artifact と同じ処理（_site を tar にまとめ、github-pages という名前で上げる）を、
      # すべてのアクションを SHA 固定で書く。upload-pages-artifact は中で actions/upload-artifact をタグ指定で呼ぶため、
      # リポジトリ設定「SHA 固定必須」（sha_pinning_required）のもとでは動かない。
      - name: 公開物を tar にまとめる
        run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

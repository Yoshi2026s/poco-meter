import_rules:
  - "candidate_eventsは検索・照合用の資料として扱う。公開用の開催履歴にはofficial_confirmed_eventsを使う。"
  - "公式投稿の本文・画像、または公式イベントページで確認できた項目だけを採用する。"
  - "開催開始・終了、エントリー締切、ライバーの配信時刻、メーターの22時締めは個別に記録する。"
  - "空欄はnullのまま保持し、推定で時刻やプライズを補完しない。"
  - "同名イベントでも開催日が異なれば別記録とする。公式イベントIDが判明したら照合に使う。"

collection_rules:
  - "Pococha公式SNS・公式イベントページに加え、ライバーやリスナー個人の公開X・Instagram・noteも毎回検索する。"
  - "イベント名の表記違い、開催候補日、公開活動名を組み合わせて、事前告知・当日投稿・結果報告を探す。"
  - "投稿本文・告知画像を確認し、元投稿URLと、どの項目を確認できたかを記録する。検索結果の抜粋だけの場合は未確認とする。"
  - "同じ告知画像の転載や同一投稿者の複数SNS投稿は、独立した裏付けとして重複計上しない。"
  - "個人投稿から得た情報は候補に追記する。個人投稿に掲載された公式画面の画像は、開催回と読める項目を照合し、掲載元URLと画像の由来を記録する。"
  - "イベント開始・終了、枠の配信予定、メーター締め、枠独自特典、公式プライズを混同しない。確認できない値はnullを保持する。"

